[package]
name = "flock-net"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Shared LAN input transport and state machine for Flockswitch"

[dependencies]
base64 = "0.22.1"
anyhow = "1.0.104"
log = "0.4.35"
mdns-sd = "0.22.0"
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "crypto"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
rustls-pki-types = "1.16.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
socket2 = "0.6.5"

[dev-dependencies]
toml = "0.8"
