[package]
name = "flockswitch"
version = "0.13.0"
edition = "2021"
license = "MIT"
description = "Turn a spare Logitech mouse button into an Easy-Switch key that moves your mouse and keyboard to another computer together"
repository = "https://github.com/WWhaleFe/flockswitch-linux"
readme = "README.md"

[dependencies]
anyhow = "1"
auto-launch = "0.6.0"
ctrlc = { version = "3", features = ["termination"] }
dirs = "5"
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts", "accesskit", "clipboard", "x11", "wayland"] }
# No "regex": RUST_LOG levels work as before; a "/text" filter matches plain text.
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }
global-hotkey = "0.9"
hidapi = "2"
log = "0.4"
memmap2 = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sys-locale = "0.3.2"
toml = "0.8"
# Draws the countdown and locate effects (overlay_render.rs).
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
# Cursor position and display layout for switching at the screen edge (X11).
x11-dl = "2.21"
# Switching at the screen edge on Wayland. GNOME: the desktop portal's InputCapture
# (pointer barriers) over D-Bus, with the captured input read over libei by reis (pure
# Rust; no libei needed). KDE, sway, Hyprland: 1-pixel wlr-layer-shell strips along the
# edges, also used to draw the countdown there. libwayland-client is loaded at run time
# (winit's wayland-dlopen), so the program still starts where it is missing.
ashpd = { version = "0.13.10", default-features = false, features = ["input_capture", "async-io"] }
reis = { version = "0.7.1", features = ["async-io"] }
async-io = "2.6"
futures-util = "0.3"
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging", "unstable"] }
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
rustix = { version = "1", features = ["event", "fs"] }
# StatusNotifierItem over D-Bus: no GTK or libappindicator needed.
tray-icon = { version = "0.26.1", default-features = false, features = ["ksni"] }
# Load libwayland at run time (no -dev package to build) and draw a title bar where the
# compositor leaves that to the app (GNOME on Wayland).
winit = { version = "0.30.13", default-features = false, features = ["wayland-dlopen", "wayland-csd-adwaita"] }

[profile.release]
lto = true
strip = true
opt-level = "s"


[build-dependencies]
png = "0.18"

